name: Security scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets and credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  code-scan:
    name: Code scan (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Scan for suspicious and vulnerable code patterns
        run: |
          semgrep scan \
            --config "p/default" \
            --exclude "app/src/vendor" \
            --exclude "app/dist" \
            --metrics=off \
            --error \
            --quiet

  dependencies:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v3